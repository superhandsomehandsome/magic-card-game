<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A1110">
<title>秘术对决：禁忌魔典</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Lobby -->
<div id="lobby" class="lobby">
  <h1>秘术对决</h1>
  <p class="subtitle">禁忌魔典</p>
  <div class="lobby-box">
    <label>你的名字</label>
    <input id="playerName" placeholder="输入昵称..." maxlength="12">
    <button class="btn" id="btnCreate" onclick="createRoom()">创建房间</button>
    <button class="btn btn-ai" id="btnAI" onclick="createAIRoom()">人机对战 — 挑战魔典守卫</button>
    <div class="or">── 或 ──</div>
    <label>输入房间号</label>
    <input id="roomInput" placeholder="4 位房间号" maxlength="4" style="letter-spacing:6px;text-align:center;font-size:1.2rem" inputmode="numeric" pattern="[0-9]*">
    <button class="btn" id="btnJoin" onclick="joinRoom()">加入房间</button>
    <div class="or">── ──</div>
    <a href="/rules" target="_blank" class="btn btn-sm" style="display:inline-block;text-decoration:none;text-align:center;color:#D4AF37">查看规则</a>
    <a href="/offline" class="btn btn-sm" style="display:inline-block;text-decoration:none;text-align:center;color:#7DD3A0;margin-top:6px">⚡ 离线版（无需联网）</a>
    <div style="margin-top:12px;font-size:.75rem;color:#6B5B3A;text-align:center;line-height:1.5">
      局域网对战：两台设备连同一 WiFi/热点，主机运行 lan_play.bat 启动服务器，<br>
      对方浏览器输入主机 IP:5000 → 创建房间 → 把 4 位房号告诉对方即可。
    </div>
  </div>
</div>

<!-- Waiting -->
<div id="waitingScreen" class="lobby hidden">
  <h1>秘术对决</h1>
  <p class="subtitle">禁忌魔典</p>
  <div class="lobby-box" style="text-align:center">
    <p class="text-muted">房间号</p>
    <div class="room-code" id="displayRoomCode"></div>
    <p class="text-muted">将此房间号发给你的对手...</p>
    <p class="waiting">等待对手加入...</p>
  </div>
</div>

<!-- Game Board -->
<div id="gameBoard" class="board hidden">
  <!-- Opponent zone (top) -->
  <div class="player-zone opp" id="oppZone"></div>

  <!-- Center arena -->
  <div class="arena" id="arenaZone"></div>

  <!-- My zone (bottom) -->
  <div class="player-zone me" id="myZone"></div>
</div>

<!-- Game Over -->
<div id="gameOver" class="game-over hidden"></div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- BGM -->
<audio id="bgm" loop preload="auto" volume="0.3">
  <source src="/static/bgm.mp3" type="audio/mpeg">
</audio>
<div id="bgmControl" class="bgm-control" onclick="toggleBGM()">🔇</div>
<div id="sfxControl" class="bgm-control" style="right:56px" onclick="toggleSFX()">🔔</div>

<script src="/static/socket.io.min.js"></script>
<script src="/static/game.js"></script>
</body>
</html>
