name: 自动部署到服务器

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: |
          cd frontend
          npm install
          npm run build

      - name: 打包部署文件
        run: |
          zip -r update_package.zip frontend/dist realtime_server.py

      - name: 上传到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: update_package.zip
          target: 'C:/Users/Administrator/Desktop/magic card/deploy/'

      - name: 解压并重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd "C:\Users\Administrator\Desktop\magic card"
            powershell -Command "Expand-Archive -Path deploy\update_package.zip -DestinationPath _tmp -Force"
            xcopy /E /Y _tmp\frontend\dist\* frontend\dist\
            copy /Y _tmp\realtime_server.py realtime_server.py
            rmdir /s /q _tmp
            del deploy\update_package.zip
            deploy\nssm.exe restart MagicCardGame
            echo 部署完成
