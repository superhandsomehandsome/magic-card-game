name: 发布单机版下载包

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # 也支持手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建单机版
        working-directory: frontend
        run: npm run build:standalone

      - name: 重命名输出文件
        run: cp "frontend/dist-standalone/index.html" "秘术对决-单机版.html"

      - name: 删除旧的 latest 发布
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建新的 latest 发布
        run: |
          gh release create latest \
            --title "秘术对决：禁忌魔典 — 单机版" \
            --notes "## 下载方式

          1. 点击下方 **秘术对决-单机版.html** 下载
          2. 用 Chrome / Edge / Firefox 打开该文件
          3. 即可开始游戏（无需安装任何软件）

          **说明：**
          - ✅ 对战 AI 完全离线可用
          - 🌐 联机模式需要联网（连接云服务器）
          - 推荐使用 Chrome 浏览器以获得最佳体验
          - 手机请横屏游玩" \
            --latest \
            "秘术对决-单机版.html"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
