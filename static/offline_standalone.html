// AI BRAIN (port of ai_player.py with ZeroBrain)
// ════════════════════════════════════════════════════════════════
let AI_IDX = 1;

function setAIIdx(i){ AI_IDX = i; }

class ZeroBrain {
  unseenDistribution(room, ai_idx){
    const full = {};
    for (const c of CARD_ORDER) full[c] = CARD_CONFIG[c].count;
    for (const c of room.players[ai_idx].hand) full[c]--;
    for (const c of room.discard_pile) full[c]--;
    if (!room._isDarkMarketTurn()) for (const c of room.market) full[c]--;
    for (let i=0;i<2;i++){
      const lc = room.players[i].lockdown_card;
      if (lc) full[lc]--;
    }
    if (room.atk_card && room.current_player === ai_idx) full[room.atk_card]--;
    return full;
  }

  oppHandDistribution(room, ai_idx){
    const unseen = this.unseenDistribution(room, ai_idx);
    const oppSize = room.players[1-ai_idx].hand.length;
    let total = 0;
    for (const c in unseen) total += unseen[c];
    const out = {};
    if (total <= 0 || oppSize <= 0){ for (const c in unseen) out[c] = 0; return out; }
    for (const c in unseen) out[c] = unseen[c] * oppSize / total;
    return out;
  }

  _attackEV(atkCard, room, ai_idx){
    const oppDist = this.oppHandDistribution(room, ai_idx);
    const oppSize = room.players[1-ai_idx].hand.length;
    if (oppSize <= 0) return 0;
    const pFold = 0.10 + Math.max(0, 4 - oppSize) * 0.05;
    const pShunInHand = Math.min(1.0, oppDist['瞬'] || 0);
    let pShunUsed = 0;
    if (atkCard === 'A') pShunUsed = Math.min(0.85, pShunInHand * 0.9);
    else if (atkCard === 'B') pShunUsed = Math.min(0.40, pShunInHand * 0.5);
    let ev = 0;
    ev += pFold * 6.0;
    const atkLoss = (BV[atkCard] || 1) * 1.5;
    ev += (1 - pFold) * pShunUsed * (-atkLoss - 2);
    let nonShunTotal = 0;
    for (const c in oppDist) if (c !== '瞬') nonShunTotal += oppDist[c];
    if (nonShunTotal <= 0) return ev;
    const pRealDefend = (1 - pFold) * (1 - pShunUsed);
    for (const defC in oppDist){
      if (defC === '瞬' || oppDist[defC] < 1e-6) continue;
      const cond = oppDist[defC] / nonShunTotal;
      const fullP = pRealDefend * cond;
      const res = compareDuel(atkCard, defC);
      let outcome = 0;
      if (res === 1){
        outcome = 6.0;
        if (atkCard === 'A' && defC !== 'F') outcome += 10;
        if (atkCard === 'F' && defC === 'A') outcome += 9;
      } else if (res === -1){
        outcome = -atkLoss;
        if (defC === 'A' && atkCard !== 'F') outcome -= 6;
        if (atkCard === 'A' && defC !== 'F') outcome += 3;
        if (defC === 'F' && atkCard === 'A') outcome -= 6;
      } else {
        outcome = -(BV[atkCard] || 1) * 0.6;
      }
      ev += fullP * outcome;
    }
    return ev;
  }

  bestAttackCard(room, ai_idx){
    const ai = room.players[ai_idx];
    const eligible = ai.hand.filter(c => c !== '瞬');
    if (!eligible.length) return null;
    const seen = new Set();
    const scored = [];
    for (const c of eligible){
      if (seen.has(c)) continue;
      seen.add(c);
      const ev = this._attackEV(c, room, ai_idx);
      const keepValue = cardValue(c, ai.hand, room, ai_idx);
      const net = ev - keepValue * 0.10;
      scored.push([c, net, ev]);
    }
    scored.sort((a,b)=> b[1] - a[1]);
    if (scored[0][1] <= 0) return null;
    return scored[0][0];
  }

  bestDefenseCard(room, ai_idx, canFold){
    const ai = room.players[ai_idx];
    const oppDist = this.oppHandDistribution(room, ai_idx);
    const atkDist = {}; let atkTotal = 0;
    for (const c in oppDist){ if (c !== '瞬'){ atkDist[c] = oppDist[c]; atkTotal += oppDist[c]; }}
    if (atkTotal <= 0) return canFold ? ['fold', null] : null;
    const eligible = ai.hand.filter(c => c !== '瞬');
    const hasShun = ai.hand.includes('瞬');
    if (!eligible.length && !hasShun) return canFold ? ['fold', null] : null;
    const avgMyVal = ai.hand.reduce((a,c)=> a + (BV[c] || 1), 0) / Math.max(1, ai.hand.length);
    const evFold = -avgMyVal * 1.2;
    const evs = {};
    if (hasShun){
      let absorbedValue = 0;
      for (const c in atkDist) absorbedValue += atkDist[c] * (BV[c] || 1);
      absorbedValue /= Math.max(atkTotal, 1);
      const highAtk = ((atkDist['A']||0) + (atkDist['B']||0)) / Math.max(atkTotal, 1);
      let evShun = absorbedValue * 1.5 - 5.0;
      evShun += highAtk * 4;
      evs['瞬'] = evShun;
    }
    const defSet = new Set(eligible);
    for (const defC of defSet){
      let ev = 0;
      for (const atkC in atkDist){
        if (atkDist[atkC] < 1e-6) continue;
        const p = atkDist[atkC] / atkTotal;
        const res = compareDuel(atkC, defC);
        if (res === -1){
          let out = 6.0;
          if (defC === 'A' && atkC !== 'F') out += 10;
          if (defC === 'F' && atkC === 'A') out += 9;
          ev += p * out;
        } else if (res === 1){
          let out = -(BV[defC] || 1) * 1.5;
          if (atkC === 'A' && defC !== 'F') out -= 6;
          if (defC === 'A' && atkC !== 'F') out += 3;
          if (defC === 'F' && atkC === 'A') out += 9;
          ev += p * out;
        } else ev += p * (-(BV[defC] || 1) * 0.6);
      }
      ev -= cardValue(defC, ai.hand, room, ai_idx) * 0.05;
      evs[defC] = ev;
    }
    if (!Object.keys(evs).length) return canFold ? ['fold', null] : null;
    let bestCard = null, bestEV = -Infinity;
    for (const c in evs){ if (evs[c] > bestEV){ bestEV = evs[c]; bestCard = c; }}
    if (canFold && evFold > bestEV + 1.0) return ['fold', null];
    return ['defend', bestCard];
  }

  bestLockdownRank(room, ai_idx){
    const oppDist = this.oppHandDistribution(room, ai_idx);
    const damage = {A:0,B:0,C:0,D:0,E:0,F:0};
    for (const r of 'ABCDEF'){
      const cnt = oppDist[r] || 0;
      if ('ABCDE'.includes(r)) damage[r] += cnt * 12;
      if ('BCDEF'.includes(r)) damage[r] += cnt * 8;
      if (cnt >= 3) damage[r] += cnt * 8;
      if (cnt >= 5) damage[r] += 30;
      if (r === 'F' && cnt >= 3) damage[r] += cnt * 4;
    }
    let bestR = 'C', bestD = -1;
    for (const r in damage){ if (damage[r] > bestD){ bestD = damage[r]; bestR = r; }}
    return bestR;
  }
}

const _brain = new ZeroBrain();

function cardValue(card, hand, room, pidx){
  if (card === '瞬') return 50;
  const ct = counter(hand.filter(c => c !== '瞬'));
  let score = BV[card] * 2;
  const have = ct[card] || 0;
  const slots = (k) => room._slotsLeft(pidx, k);
  if (have >= 4 && slots('dragon_breath') > 0) score += 40;
  else if (have >= 3){
    if (slots('triple_resonance') > 0) score += 20;
    if (slots('dragon_breath') > 0) score += 15;
  }
  if ('ABCDE'.includes(card) && slots('arcane_sequence') > 0){
    let need = 0; for (const c of 'ABCDE') if (!ct[c] || (c === card && ct[c] === 1)) need++;
    if (need <= 2) score += 25 - need * 5;
  }
  if ('BCDEF'.includes(card) && slots('elemental_surge') > 0){
    let need = 0; for (const c of 'BCDEF') if (!ct[c] || (c === card && ct[c] === 1)) need++;
    if (need <= 2) score += 18 - need * 5;
  }
  if (have >= 2 && slots('chaos_alchemy') > 0){
    for (const o in ct) if (o !== card && ct[o] >= 2){ score += 12; break; }
  }
  if (card === 'F'){
    const f = ct['F'] || 0;
    if (f >= C.ANT_COLONY_MIN_F - 1 && slots('ant_colony') > 0) score += f * 3;
  }
  return score;
}

function expendability(card, hand, room, pidx){ return 100 - cardValue(card, hand, room, pidx); }

function totalSealed(pad){
  let s = 0;
  for (const k in pad) s += pad[k].sealed;
  return s;
}

function nearCombos(hand, room, pidx){
  const ct = counter(hand.filter(c => c !== '瞬'));
  const out = [];
  const slots = (k) => room._slotsLeft(pidx, k);
  if (slots('dragon_breath') > 0){
    for (const c in ct){
      if (ct[c] >= 3){
        const sc = _scaled(40 + BV[c] * 5);
        const need = []; for (let i=0;i<5-ct[c];i++) need.push(c);
        out.push(['dragon_breath', 5-ct[c], sc, need]);
      }
    }
  }
  if (slots('arcane_sequence') > 0){
    const need = []; for (const c of 'ABCDE') if (!ct[c]) need.push(c);
    if (need.length <= 2) out.push(['arcane_sequence', need.length, _scaled(45), need]);
  }
  if (slots('elemental_surge') > 0){
    const need = []; for (const c of 'BCDEF') if (!ct[c]) need.push(c);
    if (need.length <= 2) out.push(['elemental_surge', need.length, _scaled(30), need]);
  }
  if (slots('triple_resonance') > 0){
    for (const c in ct) if (ct[c] >= 2){
      const sc = _scaled(10 + BV[c] * 3);
      out.push(['triple_resonance', 3-ct[c], sc, [c]]);
    }
  }
  if (slots('ant_colony') > 0){
    const f = ct['F'] || 0;
    const miss = Math.max(0, C.ANT_COLONY_MIN_F - f);
    if (miss <= 2) out.push(['ant_colony', miss, _scaled(Math.max(f, C.ANT_COLONY_MIN_F) * 5), Array(miss).fill('F')]);
  }
  return out;
}

function detectPlayableForRoom(room, pidx){
  const slotsFn = (k) => room._slotsLeft(pidx, k);
  return detectPlayable(room.players[pidx].hand, slotsFn);
}

function estimateOppMaxCombo(oppDist, room){
  let score = 0;
  for (const c in oppDist){
    if (c === '瞬') continue;
    const cnt = oppDist[c];
    if (cnt >= 3) score = Math.max(score, _scaled(10 + BV[c] * 3));
    if (cnt >= 5) score = Math.max(score, _scaled(40 + BV[c] * 5));
  }
  if ('ABCDE'.split('').every(c => (oppDist[c] || 0) >= 0.5))
    score = Math.max(score, _scaled(45));
  if ('BCDEF'.split('').every(c => (oppDist[c] || 0) >= 0.5))
    score = Math.max(score, _scaled(30));
  return score;
}

// ── Main decide() function ───────────────────────────────
function decide(room){
  const phase = room.phase;
  const ai = room.players[AI_IDX];
  const opp = room.players[1 - AI_IDX];
  const cp = room.current_player;
  if (phase === 'GAME_OVER') return null;
  if (phase === 'DRAW'){ if (cp !== AI_IDX) return null; return ['DRAW_ACK', {}]; }
  if (phase === 'MARKET'){ if (cp !== AI_IDX) return null; return decideMarket(ai, opp, room); }
  if (phase === 'LOCKDOWN_PLACE'){ if (cp !== AI_IDX) return null; return decideLockdownPlace(ai, opp, room); }
  if (phase === 'AMBUSH_DECIDE'){ if (cp !== AI_IDX) return null; return decideAmbush(ai, opp, room); }
  if (phase === 'AMBUSH_PAY_COST'){ if (cp !== AI_IDX) return null; return decidePayCost(ai, room); }
  if (phase === 'AMBUSH_ATK_SELECT'){ if (cp !== AI_IDX) return null; return decideAtkSelect(ai, opp, room); }
  if (phase === 'AMBUSH_DEF_CHOICE'){ if (cp === AI_IDX) return null; return decideDefend(ai, opp, room); }
  if (phase === 'SPELL'){ if (cp !== AI_IDX) return null; return decideSpell(ai, opp, room); }
  if (phase === 'END_DISCARD'){ if (cp !== AI_IDX) return null; return decideEndDiscard(ai, room); }
  if (phase === 'COLLISION_PRE_DISCARD'){ if (room.col_pre_discard_done[AI_IDX]) return null; return decideColPreDiscard(ai, opp, room); }
  if (phase === 'COLLISION_BET') return decideColBet(ai, opp, room);
  if (phase === 'COLLISION_FLIP'){ const wf = room._colWaitingFor(); if (wf !== AI_IDX) return null; return ['COLLISION_FLIP', {}]; }
  return null;
}

function decideMarket(ai, opp, room){
  const market = room.market;
  if (!market.length || room.market_buy_done[AI_IDX]) return ['MARKET_SKIP', {}];
  const hand = ai.hand;
  const ct = counter(hand.filter(c => c !== '瞬'));
  const slots = (k) => room._slotsLeft(AI_IDX, k);
  const needs = {};
  if (slots('arcane_sequence') > 0)
    for (const c of 'ABCDE') if (!ct[c]) needs[c] = Math.max(needs[c]||0, 100 - 5 * 'ABCDE'.split('').filter(x => !ct[x]).length);
  if (slots('elemental_surge') > 0)
    for (const c of 'BCDEF') if (!ct[c]) needs[c] = Math.max(needs[c]||0, 80 - 5 * 'BCDEF'.split('').filter(x => !ct[x]).length);
  for (const c in ct){
    if (c === '瞬') continue;
    if (ct[c] === 4 && slots('dragon_breath') > 0) needs[c] = Math.max(needs[c]||0, 120);
    if (ct[c] === 2 && slots('triple_resonance') > 0) needs[c] = Math.max(needs[c]||0, 70);
  }
  const isDark = room._isDarkMarketTurn();
  let bestIdx = -1, bestPri = -1;
  for (let i=0;i<market.length;i++){
    const mc = market[i];
    let pri = 0;
    if (isDark) pri = Math.random() < 0.4 ? 25 : 0;
    else {
      pri = needs[mc] || 0;
      if (pri === 0){
        if (mc === 'A') pri = 50;
        else if (mc === 'B') pri = 25;
        else if (mc === '瞬') pri = 15;
      }
    }
    if (pri > bestPri){ bestPri = pri; bestIdx = i; }
  }
  if (bestIdx < 0 || bestPri < 20) return ['MARKET_SKIP', {}];
  const target = market[bestIdx];
  const targetV = _bvMarket(target);
  const sortedHand = [...hand].sort((a,b) => (a==='瞬'?1:0) - (b==='瞬'?1:0) || _bvMarket(a) - _bvMarket(b));
  const payment = []; let total = 0;
  for (const c of sortedHand){
    if (total >= targetV) break;
    const cv = cardValue(c, hand, room, AI_IDX);
    if (cv >= 60 && total + _bvMarket(c) > targetV + 4) continue;
    payment.push(c); total += _bvMarket(c);
  }
  if (total < targetV) return ['MARKET_SKIP', {}];
  const maxPremium = bestPri >= 100 ? 2.0 : 1.4;
  if (total > targetV * maxPremium) return ['MARKET_SKIP', {}];
  if (hand.length - payment.length + 1 < 3) return ['MARKET_SKIP', {}];
  return ['MARKET_BUY', {market_idx: bestIdx, payment}];
}

function decideLockdownPlace(ai, opp, room){
  const hand = ai.hand;
  if (hand.length <= 3) return ['LOCKDOWN_SKIP', {}];
  const myT = totalScore(ai), oppT = totalScore(opp);
  const diff = myT - oppT;
  if (diff < -30) return ['LOCKDOWN_SKIP', {}];
  const targetRank = _brain.bestLockdownRank(room, AI_IDX);
  const ct = counter(hand.filter(c => c !== '瞬'));
  if (ct[targetRank] >= 1){
    if (ct[targetRank] >= 2) return ['LOCKDOWN_PLACE', {card: targetRank}];
    if (cardValue(targetRank, hand, room, AI_IDX) < 30) return ['LOCKDOWN_PLACE', {card: targetRank}];
  }
  if (hand.length >= 6){
    const eligible = hand.filter(c => c !== '瞬');
    if (eligible.length){
      const sorted = [...eligible].sort((a,b) => cardValue(a, hand, room, AI_IDX) - cardValue(b, hand, room, AI_IDX));
      const cheapest = sorted[0];
      if (cardValue(cheapest, hand, room, AI_IDX) < 25) return ['LOCKDOWN_PLACE', {card: cheapest}];
    }
  }
  return ['LOCKDOWN_SKIP', {}];
}

function decideAmbush(ai, opp, room){
  const hand = ai.hand;
  const eligible = hand.filter(c => c !== '瞬');
  if (room.turn_number < C.NO_AMBUSH_BEFORE_TURN) return ['AMBUSH_DECIDE', {choice:'skip'}];
  if (!eligible.length || hand.length <= 2) return ['AMBUSH_DECIDE', {choice:'skip'}];
  if (!opp.hand.length) return ['AMBUSH_DECIDE', {choice:'skip'}];
  const isSecond = room.ambush_count_this_turn >= 1;
  if (isSecond){
    if (hand.length <= C.AMBUSH_SECOND_COST + 2) return ['AMBUSH_DECIDE', {choice:'skip'}];
    if (opp.hand.length < 3) return ['AMBUSH_DECIDE', {choice:'skip'}];
  }
  const myScore = totalScore(ai), oppScore = totalScore(opp);
  const diff = myScore - oppScore;
  const playable = detectPlayableForRoom(room, AI_IDX);
  if (playable.length && playable[0][3] >= 25) return ['AMBUSH_DECIDE', {choice:'skip'}];
  if (diff > 35 && hand.length <= 5) return ['AMBUSH_DECIDE', {choice:'skip'}];
  // EV check (avoid attack-cancel loop)
  const bestAtk = _brain.bestAttackCard(room, AI_IDX);
  if (bestAtk === null) return ['AMBUSH_DECIDE', {choice:'skip'}];
  return ['AMBUSH_DECIDE', {choice:'attack'}];
}

function decidePayCost(ai, room){
  const hand = ai.hand;
  const rated = hand.map(c => [c, cardValue(c, hand, room, AI_IDX)]);
  rated.sort((a,b) => a[1] - b[1]);
  const toDiscard = rated.slice(0, C.AMBUSH_SECOND_COST).map(x => x[0]);
  return ['AMBUSH_PAY_COST', {cards: toDiscard}];
}

function decideAtkSelect(ai, opp, room){
  const eligible = ai.hand.filter(c => c !== '瞬');
  if (!eligible.length) return ['AMBUSH_CANCEL', {}];
  let best = _brain.bestAttackCard(room, AI_IDX);
  if (best === null){
    // Fallback: most expendable non-A
    const nonA = eligible.filter(c => c !== 'A');
    const pool = nonA.length ? nonA : eligible;
    pool.sort((a,b) => expendability(b, ai.hand, room, AI_IDX) - expendability(a, ai.hand, room, AI_IDX));
    best = pool[0];
  }
  return ['AMBUSH_ATK_SELECT', {card: best}];
}

function decideDefend(ai, opp, room){
  const hand = ai.hand;
  const eligible = hand.filter(c => c !== '瞬');
  const hasShun = hand.includes('瞬');
  if (!eligible.length && !hasShun) return ['AMBUSH_DEFEND', {choice:'fold'}];
  const near = nearCombos(hand, room, AI_IDX);
  const highValueNear = near.filter(c => c[2] >= 80 && c[1] <= 1);
  if (highValueNear.length && hand.length <= 5){
    if (hasShun) return ['AMBUSH_DEFEND', {choice:'defend', card:'瞬'}];
    return ['AMBUSH_DEFEND', {choice:'fold'}];
  }
  const decision = _brain.bestDefenseCard(room, AI_IDX, true);
  if (!decision) return ['AMBUSH_DEFEND', {choice:'fold'}];
  const [choice, card] = decision;
  if (choice === 'fold') return ['AMBUSH_DEFEND', {choice:'fold'}];
  return ['AMBUSH_DEFEND', {choice:'defend', card}];
}

function decideSpell(ai, opp, room){
  if (ai.breaker_marks > 0){
    const a = decideBreaker(room, ai, opp);
    if (a) return a;
  }
  const playable = detectPlayableForRoom(room, AI_IDX);
  if (playable.length){
    const best = pickBestCombo(playable, ai.hand, room, ai, opp);
    if (best){
      const [key, name, cards, score] = best;
      const oppLock = opp.lockdown_card;
      if (oppLock && oppLock !== '瞬' && cards.includes(oppLock)){
        if (ai.breaker_marks > 0)
          return ['SPELL_SCORE', {cards, combo_key:key, break_lockdown:'marker'}];
        if (score >= 25)
          return ['SPELL_SCORE', {cards, combo_key:key, break_lockdown:'pay'}];
        for (const e of playable){
          const [k2,n2,c2,s2] = e;
          if (!c2.includes(oppLock)) return ['SPELL_SCORE', {cards:c2, combo_key:k2}];
        }
      } else return ['SPELL_SCORE', {cards, combo_key:key}];
    }
  }
  if (ai.hand.includes('瞬') && room.instant_count < C.INSTANT_PER_TURN){
    const ia = decideInstant(ai.hand, room, ai, opp);
    if (ia) return ia;
  }
  const sac = decideSacrifice(ai, opp, room);
  if (sac) return sac;
  return ['SPELL_SKIP', {}];
}

function decideBreaker(room, ai, opp){
  let sealedTotal = 0;
  for (const k in opp.scorepad) sealedTotal += opp.scorepad[k].sealed;
  const canSeal = sealedTotal < C.SEAL_LIMIT;
  if (canSeal){
    for (const tier of [1,2,3]){
      for (const cfg of SCOREPAD_CONFIG){
        if (cfg.tier === tier && room._slotsLeft(1 - AI_IDX, cfg.key) > 0)
          return ['SPELL_BREAKER', {type:'seal', slot_key: cfg.key}];
      }
    }
  }
  if (!opp.curse_active) return ['SPELL_BREAKER', {type:'curse'}];
  return null;
}

function pickBestCombo(playable, hand, room, ai, opp){
  const myScore = totalScore(ai), oppScore = totalScore(opp);
  const winning = playable.filter(p => myScore + p[3] >= C.WIN_SCORE);
  if (winning.length){
    let best = winning[0];
    for (const w of winning) if (w[2].length < best[2].length) best = w;
    return best;
  }
  const oppDist = _brain.oppHandDistribution(room, AI_IDX);
  const oppMaxCombo = estimateOppMaxCombo(oppDist, room);
  const oppPressure = oppScore + oppMaxCombo >= C.WIN_SCORE;
  const reds = playable.filter(p => RED_KEYS.has(p[0]));
  if (reds.length && (oppPressure || myScore >= C.WIN_SCORE * 0.4)){
    let best = reds[0]; for (const r of reds) if (r[3] > best[3]) best = r; return best;
  }
  const scored = [];
  for (const [key, name, cards, base] of playable){
    const remaining = [...hand];
    for (const c of cards){ const i = remaining.indexOf(c); if (i>=0) remaining.splice(i,1); }
    const slotsFn = (k) => room._slotsLeft(AI_IDX, k);
    const future = detectPlayable(remaining, slotsFn);
    const futurePot = future.length ? future[0][3] : 0;
    let effective = base;
    if (ai.curse_active) effective -= 10;
    if (RED_KEYS.has(key)) effective += 18;
    else if (BLUE_KEYS.has(key) || GREEN_KEYS.has(key)) effective += 6;
    if (key === 'ant_colony' && cards.length <= C.ANT_COLONY_MIN_F && room.deck.length > 12) effective -= 12;
    const oppLock = opp.lockdown_card;
    if (oppLock && oppLock !== '瞬' && cards.includes(oppLock)){
      if (ai.breaker_marks > 0) effective -= 2;
      else effective -= 16;
    }
    if (oppPressure) effective += 8;
    const total = effective + futurePot * 0.35;
    scored.push([key, name, cards, base, total]);
  }
  scored.sort((a,b) => b[4] - a[4]);
  const best = scored[0];
  if (best[3] < 14 && room.deck.length > 18 && !oppPressure) return null;
  return [best[0], best[1], best[2], best[3]];
}

function decideInstant(hand, room, ai, opp){
  const nonInstant = hand.filter(c => c !== '瞬');
  if (!nonInstant.length) return null;
  const playable = detectPlayableForRoom(room, AI_IDX);
  if (playable.length && playable[0][3] >= 25) return null;
  const rated = nonInstant.map(c => [c, expendability(c, hand, room, AI_IDX)]);
  rated.sort((a,b) => b[1] - a[1]);
  const trash = rated.filter(x => x[1] >= 65).map(x => x[0]);
  if (trash.length < 2 && room.deck.length > 10) return null;
  let dCount = trash.length ? Math.min(trash.length, 3) : 0;
  let toDiscard = trash.slice(0, dCount);
  if (!dCount){
    if (hand.length >= 7){ dCount = 2; toDiscard = rated.slice(0, 2).map(x => x[0]); }
    else return null;
  }
  return ['SPELL_INSTANT', {discard_cards: toDiscard}];
}

function decideSacrifice(ai, opp, room){
  const pad = ai.scorepad;
  const myS = totalScore(ai), oppS = totalScore(opp);
  if (oppS - myS < 20) return null;
  const candidates = [];
  for (const cfg of SCOREPAD_CONFIG){
    const info = pad[cfg.key];
    for (let i=0;i<info.scores.length;i++) candidates.push([cfg.key, i, info.scores[i]]);
  }
  if (!candidates.length) return null;
  candidates.sort((a,b) => a[2] - b[2]);
  const [slotKey, scoreIdx, lost] = candidates[0];
  const window = room._sacrificeWindow();
  if (window.length < 2) return null;
  const hand = ai.hand;
  const ratedRecovery = window.map(([idx,c]) => [idx, c, cardValue(c, hand.concat([c]), room, AI_IDX)]);
  ratedRecovery.sort((a,b) => b[2] - a[2]);
  if (ratedRecovery[0][2] < 20) return null;
  const lowValHand = hand.filter(c => cardValue(c, hand, room, AI_IDX) < 15).length;
  const x = Math.min(C.SACRIFICE_MAX_X, ratedRecovery.length, lowValHand);
  if (x < 1) return null;
  const recoverIndices = ratedRecovery.slice(0, x).map(r => r[0]);
  const ratedDiscard = [...hand].sort((a,b) => cardValue(a, hand, room, AI_IDX) - cardValue(b, hand, room, AI_IDX));
  const discardCards = ratedDiscard.slice(0, x);
  const recoveryValue = ratedRecovery.slice(0, x).reduce((a,b) => a + b[2], 0);
  if (recoveryValue < lost + 20) return null;
  return ['SPELL_SACRIFICE', {slot_key: slotKey, score_idx: scoreIdx, discard_cards: discardCards, recover_indices: recoverIndices}];
}

function decideEndDiscard(ai, room){
  const hand = ai.hand;
  const overflow = handOverflow(hand);
  if (overflow <= 0) return null;
  const rated = [...hand].sort((a,b) => cardValue(a, hand, room, AI_IDX) - cardValue(b, hand, room, AI_IDX));
  return ['END_DISCARD', {cards: rated.slice(0, overflow)}];
}

function decideColPreDiscard(ai, opp, room){
  const hand = ai.hand;
  const must = room._colMustDiscard(AI_IDX);
  if (must > 0){
    const rated = [...hand].sort((a,b) => cardValue(a, hand, room, AI_IDX) - cardValue(b, hand, room, AI_IDX));
    return ['COLLISION_PRE_DISCARD', {cards: rated.slice(0, must)}];
  }
  const ct = counter(hand.filter(c => c !== '瞬'));
  const orphan = hand.filter(c => (c === 'E' || c === 'F') && c !== '瞬' && ct[c] === 1 && BV[c] <= 2);
  if (orphan.length >= 2) return ['COLLISION_PRE_DISCARD', {cards: orphan.slice(0, 2)}];
  if (orphan.length === 1) return ['COLLISION_PRE_DISCARD', {cards: orphan.slice(0, 1)}];
  return ['COLLISION_PRE_DISCARD', {cards: []}];
}

function decideColBet(ai, opp, room){
  if (room.col_bet_phase === 'CALLER' && room.col_bet_caller !== AI_IDX) return null;
  if (room.col_bet_phase === 'RESPONDER' && room.col_bet_caller === AI_IDX) return null;
  const myS = totalScore(ai), oppS = totalScore(opp);
  const diff = myS - oppS;
  let myStrength = 0;
  for (const c of ai.hand) if (c !== '瞬') myStrength += BV[c];
  const oppHandCount = opp.hand.length;
  if (room.col_bet_phase === 'CALLER'){
    if (diff < -20 && myStrength >= oppHandCount * 2.5) return ['COLLISION_BET', {amount: 20}];
    if (diff < -10) return ['COLLISION_BET', {amount: 10}];
    if (diff < 0 && myStrength >= oppHandCount * 3) return ['COLLISION_BET', {amount: 10}];
    return ['COLLISION_BET', {amount: 0}];
  }
  const bet = room.col_bet_amount;
  if (diff > bet + 10) return ['COLLISION_BET', {choice: 'fold'}];
  if (myStrength >= oppHandCount * 2.5) return ['COLLISION_BET', {choice: 'follow'}];
  if (diff < -15) return ['COLLISION_BET', {choice: 'follow'}];
  if (bet === 10) return ['COLLISION_BET', {choice: 'follow'}];
  return ['COLLISION_BET', {choice: 'fold'}];
}

const DELAY = {
  DRAW_ACK:[150,300], MARKET_BUY:[400,700], MARKET_SKIP:[150,300],
  AMBUSH_DECIDE:[300,500], AMBUSH_PAY_COST:[250,400], AMBUSH_ATK_SELECT:[300,500],
  AMBUSH_DEFEND:[300,550], AMBUSH_CANCEL:[150,250],
  SPELL_SCORE:[350,650], SPELL_INSTANT:[300,500], SPELL_SACRIFICE:[400,700],
  SPELL_BREAKER:[300,500], SPELL_SKIP:[150,300],
  END_DISCARD:[200,350], LOCKDOWN_PLACE:[350,600], LOCKDOWN_SKIP:[150,300],
  COLLISION_PRE_DISCARD:[300,500], COLLISION_BET:[400,700], COLLISION_FLIP:[150,300],
};
function getDelay(action){
  const r = DELAY[action] || [300, 600];
  return r[0] + Math.random() * (r[1] - r[0]);
}

<script>
/* 秘术对决：禁忌魔典 V5.0 黑市博弈版 — Client */

const TIER_CLASS = {A:'tier-A',B:'tier-B',C:'tier-C',D:'tier-D',E:'tier-E',F:'tier-F','瞬':'tier-inst'};
const CARD_SYM  = {A:'♠',B:'♦',C:'♣',D:'◆',E:'○',F:'△','瞬':'⚡'};
const CARD_SUB  = {A:'圣物',B:'元素',C:'中坚',D:'基础',E:'低阶',F:'杂鱼','瞬':'瞬'};
const CARD_BV   = {A:6,B:5,C:4,D:3,E:2,F:1,'瞬':0};

const SCOREPAD_CFG = [
  {key:'dragon_breath',name:'龙之吐息 (五条)',max:1,tier:1,color:'red'},
  {key:'arcane_sequence',name:'奥术序列 (大顺)',max:1,tier:1,color:'red'},
  {key:'elemental_surge',name:'元素激流 (小顺)',max:2,tier:2,color:'blue'},
  {key:'chaos_alchemy',name:'混沌炼金 (葫芦)',max:2,tier:2,color:'blue'},
  {key:'triple_resonance',name:'三重共鸣 (三条)',max:2,tier:3,color:'green'},
  {key:'ant_colony',name:'以量取胜 (蚁群)',max:2,tier:3,color:'green'},
];
const TIER_CLS = {1:'t1',2:'t2',3:'t3'};
const RED_KEYS = new Set(['dragon_breath','arcane_sequence']);

/* State */
let socket = null;
let roomId = null;
let myIdx = -1;
let state = null;
let prevState = null;
let selectedCards = [];
let timerInterval = null;
let prevHandStr = '';
let isAIRoom = false;

/* UI sub-state */
let uiMode = null;  // null | 'instant' | 'ambush_pay_cost' | 'sacrifice' | 'breaker' | 'market' | 'lockdown'
let sacState = null;  // { step: 'slot'|'discard'|'recover', slot_key, score_idx, discard, recover }
let marketState = null;  // { selectedMarketIdx }
let pendingLockedCombo = null;  // { cards, combo_key, score, lock_card }

/* Socket */
function initSocket() {
  socket = io();
  socket.on('connected', () => tryAutoReconnect());
  socket.on('room_created', d => {
    roomId = d.room_id; myIdx = d.player_idx;
    saveSession();
    if (!isAIRoom) showWaiting();
  });
  socket.on('room_joined', d => {
    roomId = d.room_id; myIdx = d.player_idx;
    saveSession();
  });
  socket.on('state', onState);
  socket.on('error', d => showToast(d.msg));
  socket.on('action_error', d => showToast(d.msg));
  socket.on('reconnect_fail', d => {
    clearSession(); showScreen('lobby');
    showToast('上一个房间已失效，请重新创建');
  });
  socket.on('opponent_away', d => showOverlay(`${d.name} 断线了`, `等待重连中... (${d.grace}秒后判定胜利)`));
  socket.on('opponent_back', d => { hideOverlay(); showToast(`${d.name} 已重连`); });
  socket.on('left_room', () => { clearSession(); location.reload(); });
}

function saveSession() {
  if (roomId !== null && myIdx >= 0)
    localStorage.setItem('mg_room', JSON.stringify({roomId, myIdx, ts: Date.now()}));
}
function clearSession() {
  roomId = null; myIdx = -1;
  localStorage.removeItem('mg_room');
}
function tryAutoReconnect() {
  const raw = localStorage.getItem('mg_room');
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (Date.now() - s.ts > 600000) { clearSession(); return; }
    socket.emit('reconnect_room', {room_id: s.roomId, player_idx: s.myIdx});
  } catch(e) { clearSession(); }
}

function createRoom() {
  const name = document.getElementById('playerName').value.trim() || '炼金术士';
  socket.emit('create_room', {name});
}
function createAIRoom() {
  const name = document.getElementById('playerName').value.trim() || '炼金术士';
  isAIRoom = true;
  socket.emit('create_ai_room', {name});
}
function joinRoom() {
  const name = document.getElementById('playerName').value.trim() || '占星师';
  const rid = document.getElementById('roomInput').value.trim().toUpperCase();
  if (rid.length !== 6) { showToast('请输入 6 位房间号'); return; }
  socket.emit('join_room', {room_id: rid, name});
}
function sendAction(action, data={}) {
  socket.emit('action', {room_id: roomId, action, data});
}

/* Screens */
function showScreen(id) {
  ['lobby','waitingScreen','gameBoard','gameOver'].forEach(s =>
    document.getElementById(s).classList.toggle('hidden', s !== id));
}
function showWaiting() {
  document.getElementById('displayRoomCode').textContent = roomId;
  showScreen('waitingScreen');
}

/* State handler */
function onState(s) {
  prevState = state;
  state = s;
  selectedCards = [];
  // reset ui modes on most transitions
  if (!prevState || prevState.phase !== s.phase) {
    uiMode = null;
    sacState = null;
    marketState = null;
    pendingLockedCombo = null;
  }

  hideOverlay();
  if (s.phase === 'GAME_OVER') { renderGameOver(); return; }
  showScreen('gameBoard');
  tryAutoPlayBGM();
  const board = document.getElementById('gameBoard');
  if (s.is_ai_game) board.classList.add('vs-zero'); else board.classList.remove('vs-zero');

  const newHandStr = (s.my_hand || []).join(',');
  const handChanged = newHandStr !== prevHandStr;
  prevHandStr = newHandStr;

  renderOppZone();
  renderMyZone(handChanged && s.phase === 'DRAW' && s.is_my_turn);
  renderArena();
  startTimer();

  // Auto-ack DRAW after brief animation
  if (s.phase === 'DRAW' && s.is_my_turn) {
    setTimeout(() => {
      if (state && state.phase === 'DRAW' && state.is_my_turn) sendAction('DRAW_ACK');
    }, 900);
  }
}

/* Card HTML */
function cardHTML(card, opts={}) {
  if (opts.faceDown) {
    const cls = 'cd cd-back' + (opts.small ? ' cd-sm' : '');
    return `<div class="${cls}"><span class="lt">☽</span></div>`;
  }
  const tier = TIER_CLASS[card] || 'tier-F';
  const sym = CARD_SYM[card] || '△';
  const sub = CARD_SUB[card] || '?';
  const bv = CARD_BV[card] ?? 0;
  let cls = `cd ${tier}` + (opts.small ? ' cd-sm' : '') + (opts.raised ? ' cd-raised' : '') +
    (opts.dim ? ' cd-dim' : '') + (opts.selectable ? ' selectable' : '') +
    (opts.extraClass ? ` ${opts.extraClass}` : '');
  return `<div class="${cls}" ${opts.onclick||''}>` +
    `<span class="sy">${sym}</span><span class="lt">${card}</span>` +
    `<span class="st">${sub}</span><span class="vl">${bv}</span></div>`;
}

/* Scorepad chips */
function padChipsHTML(pad, sharedRed, viewerIsOwner) {
  let h = '<div class="sp-inline">';
  for (const cfg of SCOREPAD_CFG) {
    const info = pad[cfg.key];
    const tc = TIER_CLS[cfg.tier] || 't3';
    let slots = '';
    for (const s of info.scores) slots += `<span class="sp-val">${s}</span> `;
    for (let i = 0; i < info.sealed; i++) slots += '<span class="sp-lk">✦</span> ';
    let rem = info.max_slots - info.scores.length - info.sealed;
    // For shared red: if taken by other player, show locked instead of remaining
    let sharedLocked = false;
    if (RED_KEYS.has(cfg.key) && sharedRed) {
      const owner = sharedRed[cfg.key];
      if (owner !== -1 && info.scores.length === 0) {
        sharedLocked = true;
        rem = 0;
      }
    }
    if (sharedLocked) slots += '<span class="sp-shared-locked" title="已被对手占用">⊗</span> ';
    for (let i = 0; i < rem; i++) slots += '☐ ';
    const short = cfg.name.split('(')[0].trim();
    h += `<span class="sp-chip ${tc}${sharedLocked ? ' sp-locked' : ''}">${short} ${slots}</span>`;
  }
  return h + '</div>';
}

/* Player bars */
function playerBarHTML(name, score, winScore, handCount, pad, isActive, breaker, deckCount, discardCount, sharedRed, curse) {
  const icon = name.includes('炼金') ? '🧙' : '🔮';

function renderMyZone(animateDraw) {

  return h;
}

function needsCardSelection() {
  const p = state.phase;
  // Defender selection on AMBUSH_DEF_CHOICE
  if (p === 'AMBUSH_DEF_CHOICE' && !state.is_my_turn) return true;
  if (p === 'AMBUSH_ATK_SELECT' && state.is_my_turn) return true;
  if (p === 'AMBUSH_PAY_COST' && state.is_my_turn) return true;
  if (p === 'SPELL' && state.is_my_turn) return true;
  if (p === 'END_DISCARD' && state.is_my_turn) return true;
  if (p === 'LOCKDOWN_PLACE' && state.is_my_turn) return true;
  if (p === 'MARKET' && state.is_my_turn && uiMode === 'market') return true;
  if (p === 'COLLISION_PRE_DISCARD') return true;
  return false;
}

function canSelectCard(card, idx) {
  const p = state.phase;
  if (p === 'AMBUSH_ATK_SELECT') return card !== '瞬';
  if (p === 'AMBUSH_DEF_CHOICE') return true;
  if (p === 'AMBUSH_PAY_COST') return true;
  if (p === 'SPELL') {
    if (uiMode === 'instant') return card !== '瞬';
    if (uiMode === 'sacrifice' && sacState && sacState.step === 'discard') return true;
    return card !== '瞬';
  }
  if (p === 'MARKET' && uiMode === 'market') return true;
  if (p === 'END_DISCARD') return true;
  if (p === 'LOCKDOWN_PLACE') return card !== '瞬';
  if (p === 'COLLISION_PRE_DISCARD') return true;
  return false;
}

function toggleCard(idx) {
  const p = state.phase;
  const single = (p === 'AMBUSH_ATK_SELECT' || p === 'AMBUSH_DEF_CHOICE');
  if (single) {
    selectedCards = selectedCards.includes(idx) ? [] : [idx];
  } else {
    if (selectedCards.includes(idx)) selectedCards = selectedCards.filter(i => i !== idx);
    else selectedCards.push(idx);
  }
  renderMyZone(false);
  renderArena();
}

/* Timer */
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerDisplay, 500);
}
function getTimeLeft() {
  if (!state || !state.turn_deadline) return -1;
  return Math.max(0, Math.ceil(state.turn_deadline - Date.now()/1000));
}
function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  const left = getTimeLeft();
  if (left < 0) { el.textContent = ''; return; }
  const cls = left <= 10 ? 'timer-urgent' : '';
  el.innerHTML = `<span class="${cls}">${left}s</span>`;
}

/* Top controls */
function renderTopControls() {
  return `<div class="top-controls">
    <button class="btn btn-sm" onclick="confirmLeave()">退出</button>
    <button class="btn btn-sm btn-danger" onclick="confirmSurrender()">投降</button>
  </div>`;
}
function confirmSurrender() {
  showOverlay('确定投降？', '投降后对手将直接获胜',
    `<div class="action-bar"><button class="btn btn-danger" onclick="doSurrender()">确定投降</button>` +
    `<button class="btn" onclick="hideOverlay()">取消</button></div>`);
}
function doSurrender() { hideOverlay(); const rid = roomId; clearSession(); socket.emit('surrender', {room_id: rid}); }
function confirmLeave() {
  showOverlay('退出房间？', '退出后对手将直接获胜',
    `<div class="action-bar"><button class="btn btn-danger" onclick="doLeave()">确定退出</button>` +
    `<button class="btn" onclick="hideOverlay()">取消</button></div>`);
}
function doLeave() { hideOverlay(); const rid = roomId; clearSession(); socket.emit('leave_game', {room_id: rid}); }

/* Overlay */
function showOverlay(title, msg, buttonsHTML) {
  let el = document.getElementById('overlay');
  if (!el) { el = document.createElement('div'); el.id = 'overlay'; document.body.appendChild(el); }
  el.className = 'overlay';
  el.innerHTML = `<div class="overlay-box"><h2>${title}</h2><p>${msg}</p>${buttonsHTML||''}</div>`;
}
function hideOverlay() {
  const el = document.getElementById('overlay');
  if (el) el.remove();
}

/* Arena */
function renderArena() {
  const s = state;
  const el = document.getElementById('arenaZone');
  let h = renderTopControls();
  h += `<div class="phase-bar">${phaseLabel(s.phase)} — 回合 ${s.turn_number}` +
       ` <span class="timer-bar" id="timerDisplay"></span></div>`;
  if (s.turn_number < (s.no_ambush_before || 0) && s.phase !== 'GAME_OVER') {
    h += `<div class="phase-bar" style="border-color:#5D4A8C;background:rgba(93,74,140,.1)">【蓄力期】前 ${s.no_ambush_before - 1} 回合不能发起突袭</div>`;
  }
  if (s.deck_low) {
    h += `<div class="deck-warning">⚠ 牌库仅剩 ${s.deck_count} 张 — 终局将至！</div>`;
  }
  h += renderLog();
  h += renderAmbushOutcome();

  // V5: Always render market panel above phase content
  h += renderMarketPanel();
  // V5: Show opponent's lockdown banner
  h += renderLockdownBanner();

  switch (s.phase) {
    case 'DRAW': h += renderDraw(); break;
    case 'MARKET': h += renderMarketPhase(); break;
    case 'AMBUSH_DECIDE': h += renderAmbushDecide(); break;
    case 'AMBUSH_PAY_COST': h += renderAmbushPayCost(); break;
    case 'AMBUSH_ATK_SELECT': h += renderAmbushAtkSelect(); break;
    case 'AMBUSH_DEF_CHOICE': h += renderAmbushDefChoice(); break;
    case 'SPELL': h += renderSpell(); break;
    case 'END_DISCARD': h += renderEndDiscard(); break;
    case 'LOCKDOWN_PLACE': h += renderLockdownPlace(); break;
    case 'COLLISION_PRE_DISCARD': h += renderColPreDiscard(); break;
    case 'COLLISION_BET': h += renderColBet(); break;
    case 'COLLISION_FLIP': h += renderColFlip(); break;
    default: h += `<div class="text-center text-muted">等待中...</div>`;
  }
  el.innerHTML = h;
}

function phaseLabel(p) {
  const m = {
    DRAW:'壹 · 汲取',
    MARKET:'壹 · 黑市',
    AMBUSH_DECIDE:'贰 · 突袭',
    AMBUSH_PAY_COST:'贰 · 明弃代价',
    AMBUSH_ATK_SELECT:'贰 · 暗扣出牌',
    AMBUSH_DEF_CHOICE:'贰 · 迎战 / 怯战',
    SPELL:'叁 · 咏唱',
    END_DISCARD:'肆 · 弃牌',
    LOCKDOWN_PLACE:'肆 · 明牌封锁',
    COLLISION_PRE_DISCARD:'终局 · 对撞前弃牌',
    COLLISION_BET:'终局 · 对撞赌注',
    COLLISION_FLIP:'终局 · 对撞翻牌',
  };
  return m[p] || p;
}

function renderLog() {
  if (!state.log || !state.log.length) return '';
  let h = '<div class="game-log">';
  for (const e of state.log) h += `<div class="log-entry">${e.msg}</div>`;
  return h + '</div>';
}

function renderAmbushOutcome() {
  // Show last ambush outcome briefly at top of arena (during AMBUSH_DECIDE or SPELL)
  const o = state.ambush_last_outcome;
  if (!o) return '';
  const p = state.phase;
  if (!(p === 'AMBUSH_DECIDE' || p === 'SPELL')) return '';
  let label = '';
  if (o.outcome === 'fold') label = `【上次突袭】${o.atk} × 对手怯战 — 窃取 ${o.stole} 张`;
  else if (o.outcome === 'shun_absorb') label = `【上次突袭】${o.atk} 被「瞬」吸收 — 强制平局`;
  else if (o.outcome === 'win') label = `【上次突袭】${o.atk} > ${o.def} — 攻击方胜 · 抽${o.drew}偷${o.stole}`;
  else if (o.outcome === 'lose') label = `【上次突袭】${o.atk} < ${o.def} — 防守方胜 · 抽${o.drew}偷${o.stole}`;
  else if (o.outcome === 'tie') label = `【上次突袭】${o.atk} = ${o.def} — 平局`;
  else if (o.outcome === 'auto_win') label = `【上次突袭】${o.atk} 自动胜利（对手无牌）`;
  return `<div class="ambush-outcome">${label}</div>`;
}

/* ── V5: Market panel (always visible above phase content) ── */
function renderMarketPanel() {
  const s = state;
  const market = s.market || [];
  if (!market.length) {
    return `<div class="market-panel market-empty"><span class="market-title">⚖ 黑市</span><span class="text-muted">（空）</span></div>`;
  }
  const dark = s.market_dark;
  let h = `<div class="market-panel${dark ? ' market-dark' : ''}">`;
  h += `<div class="market-title">⚖ 黑市${dark ? ' · 暗市夜' : ''}</div>`;
  h += `<div class="market-cards">`;
  for (let i = 0; i < market.length; i++) {
    const c = market[i];
    if (dark) {
      h += `<div class="cd cd-sm cd-back market-card"><span class="lt">？</span></div>`;
    } else {
      h += cardHTML(c, {small:true, extraClass:'market-card'});
    }
  }
  h += `</div></div>`;
  return h;
}

function renderLockdownBanner() {
  const s = state;
  let h = '';
  if (s.opp_lockdown) {
    h += `<div class="lockdown-banner lockdown-against">🔒 对手封锁了 [${s.opp_lockdown}] — 含此等级的组合本回合被禁`;
    if (s.opp_lockdown_debt > 0) h += `（对手魔力债 ${s.opp_lockdown_debt}）`;
    h += `</div>`;
  }
  if (s.my_lockdown) {
    h += `<div class="lockdown-banner lockdown-mine">🔒 我已布置封锁牌 [${s.my_lockdown}]（对手下回合受限）</div>`;
  }
  if (s.my_lockdown_debt > 0) {
    h += `<div class="lockdown-banner lockdown-debt">⚠ 我背负魔力债 ${s.my_lockdown_debt} — 下次计分优先扣除</div>`;
  }
  return h;
}

/* ── V5: Market Phase ──────────────────────────────── */
function renderMarketPhase() {
  const s = state;
  if (!s.is_my_turn) return '<div class="text-center text-muted">对手正在交易黑市...</div>';
  if (s.market_buy_done_me) {
    // already bought, just show skip
    return `<div class="text-center"><p class="text-muted">本回合已购买 · 进入下一阶段</p>
      <div class="action-bar"><button class="btn btn-success" onclick="sendAction('MARKET_SKIP')">继续</button></div></div>`;
  }
  if (uiMode === 'market') return renderMarketBuy();

  let h = '<div class="text-center">';
  h += `<p style="color:#D4AF37">壹 · 黑市${s.market_dark ? '（暗市夜 · 盲买）' : ''}</p>`;
  h += `<p class="text-muted" style="font-size:.85rem">点击商品开始购买，或跳过进入下一阶段。</p>`;
  if ((s.market || []).length === 0) {
    h += `<p class="text-muted">黑市无商品 · </p>`;
    h += `<div class="action-bar"><button class="btn btn-success" onclick="sendAction('MARKET_SKIP')">跳过</button></div>`;
    return h + '</div>';
  }
  h += '<div class="market-buy-grid">';
  for (let i = 0; i < s.market.length; i++) {
    const c = s.market[i];
    const v = (c === '瞬' ? 5 : CARD_BV[c]);
    if (s.market_dark) {
      h += `<div class="market-buy-slot" onclick="enterMarketBuy(${i})"><div class="cd cd-back"><span class="lt">？</span></div><div class="market-price">价 ?</div></div>`;
    } else {
      h += `<div class="market-buy-slot" onclick="enterMarketBuy(${i})">${cardHTML(c)}<div class="market-price">价 ${v}</div></div>`;
    }
  }
  h += '</div>';
  h += '<div class="action-bar"><button class="btn" onclick="sendAction(\'MARKET_SKIP\')">跳过黑市</button></div>';
  return h + '</div>';
}

function enterMarketBuy(idx) {
  uiMode = 'market';
  marketState = {selectedMarketIdx: idx};
  selectedCards = [];
  renderArena();
  renderMyZone(false);
}

function renderMarketBuy() {
  const s = state;
  const idx = marketState.selectedMarketIdx;
  const target = s.market[idx];
  const targetV = (target === '瞬' ? 5 : CARD_BV[target]);
  const sumVal = selectedCards.reduce((acc, i) => {
    const c = s.my_hand[i];
    return acc + (c === '瞬' ? 5 : CARD_BV[c]);
  }, 0);
  let h = `<div class="market-buy-confirm">`;
  if (s.market_dark) {
    h += `<p style="color:#D4AF37">暗市夜盲买 · 选择支付牌（按估值挑选）</p>`;
    h += `<p class="text-muted">已付 ${sumVal} 总值（暗市无显价）</p>`;
  } else {
    h += `<p style="color:#D4AF37">购买 ${target} · 需 ≥ ${targetV} 总基础值</p>`;
    h += `<p class="text-muted">已选 ${selectedCards.length} 张 · 总值 ${sumVal}/${targetV}</p>`;
  }
  h += '<div class="action-bar">';
  if (s.market_dark ? selectedCards.length > 0 : sumVal >= targetV) {
    const payment = selectedCards.map(i => s.my_hand[i]);
    h += `<button class="btn btn-success" onclick="confirmMarketBuy(${JSON.stringify(payment).replace(/"/g,'&quot;')})">确认购买</button>`;
  }
  h += `<button class="btn" onclick="exitUIMode()">取消</button>`;
  return h + '</div></div>';
}

function confirmMarketBuy(payment) {
  const idx = marketState.selectedMarketIdx;
  uiMode = null; marketState = null; selectedCards = [];
  sendAction('MARKET_BUY', {market_idx: idx, payment: payment});
}

/* ── V5: Lockdown Place ────────────────────────────── */
function renderLockdownPlace() {
  const s = state;
  if (!s.is_my_turn) return '<div class="text-center text-muted">对手正在布置封锁...</div>';
  let h = '<div class="text-center">';
  h += `<p style="color:#9B0000;font-size:1.05rem">肆 · 明牌封锁（可选）</p>`;
  h += `<p class="text-muted" style="font-size:.85rem">选 1 张牌摆在自己场上 → 对手下回合任何含该等级的组合都被禁。<br>对手可花 ${s.lockdown_break_cost} 分（鲜血破拆）或 1 枚破法者标记解除。下回合开始时该牌入弃牌堆。</p>`;
  h += '<div class="action-bar">';
  if (selectedCards.length === 1) {
    const card = state.my_hand[selectedCards[0]];
    h += `<button class="btn btn-danger" onclick="sendAction('LOCKDOWN_PLACE',{card:'${card}'})">封锁 [${card}]</button>`;
  }
  h += `<button class="btn" onclick="sendAction('LOCKDOWN_SKIP')">跳过封锁</button>`;
  return h + '</div></div>';
}

/* ── Phase: Draw (auto-animation) ──────────────────── */
function renderDraw() {
  const s = state;
  if (!s.is_my_turn) return '<div class="text-center text-muted">对手正在汲取魔力...</div>';
  const n = (s.drawn_cards || []).length;
  const mark = s.draw_was_overdraft ? '（透支仅抽 1）' : '';
  let h = `<div class="text-center"><p style="color:#D4AF37">汲取魔力 — 获得 ${n} 张新牌 ${mark}</p>`;
  h += '<div class="cards-row">';
  for (const c of (s.drawn_cards || [])) h += cardHTML(c, {extraClass:'anim-draw'});
  h += '</div></div>';
  return h;
}

/* ── Phase: Ambush Decide ──────────────────────────── */
function renderAmbushDecide() {
  const s = state;
  if (!s.is_my_turn) return '<div class="text-center text-muted">对手正在抉择突袭...</div>';
  const isSecond = s.ambush_count >= 1;
  let h = '<div class="text-center">';
  if (isSecond) {
    h += `<p style="color:#FF6B6B">第 2 次突袭需明弃 ${s.ambush_second_cost} 张手牌</p>`;
  } else {
    h += `<p class="text-muted">可选择发起突袭或跳过（最多 ${s.ambush_max} 次/回合）</p>`;
  }
  h += '<div class="action-bar">';
  h += `<button class="btn btn-danger" onclick="sendAction('AMBUSH_DECIDE',{choice:'attack'})">${isSecond ? '发起第二次突袭' : '发起突袭'}</button>`;
  h += `<button class="btn" onclick="sendAction('AMBUSH_DECIDE',{choice:'skip'})">${isSecond ? '满足当前战果' : '跳过突袭'}</button>`;
  return h + '</div></div>';
}

/* ── Phase: Ambush Pay Cost (2nd ambush) ───────────── */
function renderAmbushPayCost() {
  const s = state;
  if (!s.is_my_turn) return '<div class="text-center text-muted">对手正在支付代价...</div>';
  const need = s.ambush_second_cost;
  let h = `<div class="text-center"><p style="color:#FF6B6B">明弃 ${need} 张手牌以发起第二次突袭</p>`;
  h += `<p class="text-muted">已选 ${selectedCards.length}/${need}</p>`;
  h += '<div class="action-bar">';
  if (selectedCards.length === need) {
    const cards = selectedCards.map(i => state.my_hand[i]);
    h += `<button class="btn btn-danger" onclick="sendAction('AMBUSH_PAY_COST',{cards:${JSON.stringify(cards)}})">确认明弃</button>`;
  }
  h += `<button class="btn" onclick="sendAction('AMBUSH_CANCEL')">取消</button>`;
  return h + '</div></div>';
}

/* ── Phase: Ambush Atk Select ──────────────────────── */
function renderAmbushAtkSelect() {
  if (!state.is_my_turn) return '<div class="text-center text-muted">对手正在暗扣...</div>';
  let h = '<div class="text-center"><p class="text-muted">选择一张牌（非瞬）暗扣发起拼点</p><div class="action-bar">';
  if (selectedCards.length === 1) {
    const card = state.my_hand[selectedCards[0]];
    h += `<button class="btn btn-danger" onclick="sendAction('AMBUSH_ATK_SELECT',{card:'${card}'})">确认暗扣</button>`;
  }
  h += `<button class="btn" onclick="sendAction('AMBUSH_CANCEL')">取消</button>`;
  return h + '</div></div>';
}

/* ── Phase: Ambush Defend Choice (Fold or Defend) ──── */
function renderAmbushDefChoice() {
  const isDefender = !state.is_my_turn;
  if (!isDefender) return '<div class="text-center text-muted">对手正在抉择迎战或怯战...</div>';
  let h = '<div class="defend-alert">对手暗扣了一张牌！选择迎战或怯战</div>';
  h += '<div class="text-center">';
  h += '<p class="text-muted" style="font-size:.85rem">怯战：对手偷你 1 张随机牌，但暗扣牌进弃牌堆</p>';
  h += '<p class="text-muted" style="font-size:.85rem">迎战：比点数。胜者抽 1 + 偷对方 1。「瞬」强制吸收为平局。</p>';
  h += '<div class="action-bar">';
  if (selectedCards.length === 1) {
    const card = state.my_hand[selectedCards[0]];
    h += `<button class="btn btn-success" onclick="sendAction('AMBUSH_DEFEND',{choice:'defend',card:'${card}'})">迎战 [${card}]</button>`;
  }
  h += `<button class="btn btn-danger" onclick="sendAction('AMBUSH_DEFEND',{choice:'fold'})">怯战 (Fold)</button>`;
  return h + '</div></div>';
}

/* ── Phase: Spell ──────────────────────────────────── */
function renderSpell() {
  const s = state;
  if (!s.is_my_turn) return '<div class="text-center text-muted">对手正在咏唱...</div>';

  let h = '<div>';
  if (s.my_curse) h += '<div class="text-center" style="color:#C0392B;font-size:.85rem">诅咒生效：下一次计分 −10</div>';

  // Mode overlays
  if (uiMode === 'instant') return h + renderInstantMode() + '</div>';
  if (uiMode === 'sacrifice') return h + renderSacrificeMode() + '</div>';
  if (uiMode === 'breaker') return h + renderBreakerMode() + '</div>';

  h += '<div class="action-bar">';
  if (s.my_breaker > 0) h += `<button class="btn btn-sm" onclick="enterBreakerMode()">破法者 (${s.my_breaker})</button>`;
  if (s.instant_count < s.instant_limit && s.my_hand.includes('瞬'))
    h += `<button class="btn btn-sm" onclick="enterInstantMode()">使用瞬</button>`;
  if ((s.sacrifice_slots || []).length > 0)
    h += `<button class="btn btn-sm btn-danger" onclick="enterSacrificeMode()">黑暗献祭</button>`;
  h += '</div>';

  h += renderScorepadGrid();

  h += '<div class="action-bar mt-2">';
  if (selectedCards.length > 0) {
    const cards = selectedCards.map(i => s.my_hand[i]);
    h += `<button class="btn btn-success" onclick="tryScore()">提交计分 [${cards.join(',')}]</button>`;
  }
  h += `<button class="btn" onclick="sendAction('SPELL_SKIP')">结束咏唱</button>`;
  h += '</div></div>';
  return h;
}

function renderScorepadGrid() {
  const s = state;
  const combos = s.playable_combos || [];
  const comboMap = {};
  for (const c of combos) {
    // Support multiple same-key entries (ant_colony with different Fs)
    if (!comboMap[c.key] || c.score > comboMap[c.key].score) comboMap[c.key] = c;
  }

  let h = '<table class="sp-grid"><tr><th>咒语</th><th>状态</th><th>奖励</th><th>可得分</th></tr>';
  for (const cfg of SCOREPAD_CFG) {
    const info = s.my_pad[cfg.key];
    let slotsLeft = info.max_slots - info.scores.length - info.sealed;
    let sharedLocked = false;
    if (RED_KEYS.has(cfg.key) && s.shared_red && s.shared_red[cfg.key] !== -1 && info.scores.length === 0) {
      sharedLocked = true;
      slotsLeft = 0;
    }
    const combo = comboMap[cfg.key];
    const rowCls = combo && slotsLeft > 0 ? ' class="sp-avail"' : '';
    h += `<tr${rowCls}>`;
    h += `<td>${cfg.name}</td>`;

    let statusParts = [];
    for (const sc of info.scores) statusParts.push(`<span class="sp-filled">${sc}</span>`);
    for (let i = 0; i < info.sealed; i++) statusParts.push('<span class="sp-sealed-cell">✦</span>');
    if (sharedLocked) statusParts.push('<span class="sp-shared-locked">⊗</span>');
    for (let i = 0; i < slotsLeft; i++) statusParts.push('☐');
    h += `<td>${statusParts.join(' ')}</td>`;

    let reward = '';
    if (cfg.color === 'red') reward = '🔥 对手弃 2';
    else if (cfg.color === 'blue') reward = '💧 抽 1';
    else if (cfg.color === 'green') reward = '🌿 抽 1';
    h += `<td>${reward}</td>`;

    if (combo && slotsLeft > 0) {
      h += `<td class="sp-score-preview">${combo.score} [${combo.cards.join(',')}]</td>`;
    } else if (sharedLocked) {
      h += '<td class="text-muted">已被对手锁定</td>';
    } else {
      h += '<td>—</td>';
    }
    h += '</tr>';
  }
  return h + '</table>';
}

/* ── Instant mode ─────────────────────────────────── */
function enterInstantMode() {
  uiMode = 'instant';
  selectedCards = [];
  renderMyZone(false); renderArena();
}
function exitUIMode() {
  uiMode = null; sacState = null; selectedCards = [];
  renderMyZone(false); renderArena();
}
function renderInstantMode() {
  let h = '<div class="text-center"><p style="color:#9B59B6">使用「瞬」— 选择弃牌 (1~3 张非瞬)，下回合透支抽 1</p>';
  h += `<p class="text-muted">已选 ${selectedCards.length}</p>`;
  h += '<div class="action-bar">';
  const cards = selectedCards.map(i => state.my_hand[i]).filter(c => c !== '瞬');
  if (cards.length > 0 && cards.length <= 3)
    h += `<button class="btn btn-success" onclick="confirmInstant()">确认 (弃${cards.length}张)</button>`;
  h += `<button class="btn" onclick="exitUIMode()">取消</button>`;
  return h + '</div></div>';
}
function confirmInstant() {
  const cards = selectedCards.map(i => state.my_hand[i]).filter(c => c !== '瞬');
  uiMode = null; selectedCards = [];
  sendAction('SPELL_INSTANT', {discard_cards: cards});
}

/* ── Breaker mode ─────────────────────────────────── */
function enterBreakerMode() { uiMode = 'breaker'; renderArena(); }
function renderBreakerMode() {
  const s = state;
  let h = '<div class="text-center"><p style="color:#D4AF37">破法者 — 选择效果</p><div class="action-bar">';
  for (const cfg of SCOREPAD_CFG) {
    const info = s.opp_pad[cfg.key];
    let slotsLeft = info.max_slots - info.scores.length - info.sealed;
    if (RED_KEYS.has(cfg.key) && s.shared_red[cfg.key] !== -1) slotsLeft = 0;
    if (slotsLeft > 0)
      h += `<button class="btn btn-sm btn-danger" onclick="doBreaker('seal','${cfg.key}')">封印 ${cfg.name.split('(')[0]}</button>`;
  }
  h += `<button class="btn btn-sm" onclick="doBreaker('curse')">施加诅咒</button>`;
  h += `<button class="btn btn-sm" onclick="exitUIMode()">取消</button>`;
  return h + '</div></div>';
}
function doBreaker(type, slotKey) {
  uiMode = null;
  if (type === 'seal') sendAction('SPELL_BREAKER', {type:'seal', slot_key: slotKey});
  else sendAction('SPELL_BREAKER', {type:'curse'});
}

/* ── Sacrifice mode (multi-step) ──────────────────── */
function enterSacrificeMode() {
  uiMode = 'sacrifice';
  sacState = {step:'slot', slot_key:null, score_idx:-1, discard:[], recover:[]};
  selectedCards = [];
  renderArena();
}
function renderSacrificeMode() {
  const s = state;
  let h = '<div class="sacrifice-panel"><p style="color:#8B0000;font-size:1.05rem">黑暗献祭</p>';
  h += '<p class="text-muted" style="font-size:.85rem">选择已计分的格子 → 扣除其分数并永久封印 → 弃 X 张换取近期弃牌堆中的 X 张。发动后本回合结束。</p>';

  if (sacState.step === 'slot') {
    h += '<p>选择一个要献祭的计分：</p><div class="action-bar">';
    for (const slot of (s.sacrifice_slots || [])) {
      for (let i = 0; i < slot.scores.length; i++) {
        h += `<button class="btn btn-sm btn-danger" onclick="sacPickSlot('${slot.key}',${i},${slot.scores[i]})">`
          + `${slot.name.split('(')[0]}(-${slot.scores[i]})</button>`;
      }
    }
    h += `<button class="btn btn-sm" onclick="exitUIMode()">取消</button></div>`;
  } else if (sacState.step === 'discard') {
    h += `<p>步骤 2/3 — 选择 1~${s.sacrifice_max_x} 张要弃掉的手牌 <span style="color:#8B0000">(将丢入弃牌堆)</span></p>`;
    h += `<p class="text-muted">已选 ${selectedCards.length} · 待献祭：${sacState.slot_key}</p>`;
    h += '<div class="action-bar">';
    const n = selectedCards.length;
    if (n >= 1 && n <= s.sacrifice_max_x) {
      h += `<button class="btn btn-success" onclick="sacConfirmDiscard()">继续 (弃${n}张)</button>`;
    }
    h += `<button class="btn" onclick="exitUIMode()">取消</button></div>`;
  } else if (sacState.step === 'recover') {
    h += `<p>步骤 3/3 — 从近期弃牌堆中精准挑选 ${sacState.discard.length} 张加入手牌</p>`;
    h += `<p class="text-muted">已选 ${sacState.recover.length}/${sacState.discard.length}</p>`;
    h += '<div class="sac-window">';
    for (const [idx, card] of (s.sacrifice_window || [])) {
      const chosen = sacState.recover.includes(idx);
      h += `<div onclick="sacToggleRecover(${idx})" class="sac-pick ${chosen ? 'chosen' : ''}">`
        + cardHTML(card, {small:true, extraClass: chosen ? 'cd-raised' : ''}) + '</div>';
    }
    h += '</div><div class="action-bar">';
    if (sacState.recover.length === sacState.discard.length && sacState.recover.length >= 1) {
      h += `<button class="btn btn-success" onclick="sacExecute()">发动黑暗献祭</button>`;
    }
    h += `<button class="btn" onclick="exitUIMode()">取消</button></div>`;
  }
  return h + '</div>';
}

function sacPickSlot(key, idx, _score) {
  sacState.slot_key = key; sacState.score_idx = idx;
  sacState.step = 'discard';
  selectedCards = [];
  renderMyZone(false); renderArena();
}
function sacConfirmDiscard() {
  const cards = selectedCards.map(i => state.my_hand[i]);
  if (!cards.length) return;
  sacState.discard = cards;
  sacState.step = 'recover';
  sacState.recover = [];
  selectedCards = [];
  renderMyZone(false); renderArena();
}
function sacToggleRecover(idx) {
  const i = sacState.recover.indexOf(idx);
  if (i >= 0) sacState.recover.splice(i, 1);
  else {
    if (sacState.recover.length >= sacState.discard.length) return;
    sacState.recover.push(idx);
  }
  renderArena();
}
function sacExecute() {
  const payload = {
    slot_key: sacState.slot_key,
    score_idx: sacState.score_idx,
    discard_cards: sacState.discard,
    recover_indices: sacState.recover,
  };
  uiMode = null; sacState = null; selectedCards = [];
  sendAction('SPELL_SACRIFICE', payload);
}

/* ── Scoring submit ───────────────────────────────── */
function tryScore() {
  const cards = selectedCards.map(i => state.my_hand[i]);
  const combos = state.playable_combos || [];
  let match = null;
  for (const c of combos) { if (arraysMatchUnordered(c.cards, cards)) { match = c; break; } }
  if (!match) {
    const detected = clientFindCombo(cards);
    if (detected) match = detected;
  }
  if (!match) { showToast('所选牌无法构成有效组合'); return; }

  // V5: Check lockdown
  const lock = state.opp_lockdown;
  if (lock && lock !== '瞬' && cards.includes(lock)) {
    pendingLockedCombo = {cards, combo_key: match.key, score: match.score || 0, lock_card: lock};
    showLockdownBreakDialog();
    return;
  }
  sendAction('SPELL_SCORE', {cards, combo_key: match.key});
}

function showLockdownBreakDialog() {
  const c = pendingLockedCombo;
  const cost = state.lockdown_break_cost;
  const myMarks = state.my_breaker || 0;
  let h = `<div id="lockdownDialog" class="modal-backdrop" onclick="closeLockdownDialog()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 style="color:#9B0000">⚠ 组合被封锁</h3>
      <p>所选 [${c.cards.join(',')}] 含被封锁等级 [${c.lock_card}]<br>
      请选择破拆方式：</p>
      <div class="action-bar" style="flex-direction:column;gap:.4rem">`;
  if (myMarks > 0) {
    h += `<button class="btn btn-success" onclick="doBreakLockdown('marker')">使用 1 枚破法者标记（免费解除）</button>`;
  }
  h += `<button class="btn btn-danger" onclick="doBreakLockdown('pay')">鲜血破拆 — 支付 ${cost} 分${myBreakDebtPreview()}</button>`;
  h += `<button class="btn" onclick="closeLockdownDialog()">取消（不计分）</button>`;
  h += `</div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', h);
}
function myBreakDebtPreview() {
  const cur = state.my_score;
  const cost = state.lockdown_break_cost;
  if (cur >= cost) return '';
  const debt = cost - Math.max(0, cur);
  return `<br><small style="color:#FFB58A">分数不足 → 背负 ${debt} 魔力债</small>`;
}
function closeLockdownDialog() {
  pendingLockedCombo = null;
  const el = document.getElementById('lockdownDialog');
  if (el) el.remove();
}
function doBreakLockdown(method) {
  const c = pendingLockedCombo;
  closeLockdownDialog();
  sendAction('SPELL_SCORE', {cards: c.cards, combo_key: c.combo_key, break_lockdown: method});
}

function clientFindCombo(cards) {
  if (!cards.length || cards.includes('瞬')) return null;
  const ct = {};
  for (const c of cards) ct[c] = (ct[c]||0) + 1;
  const keys = Object.keys(ct);
  const n = cards.length;
  const pad = state.my_pad;
  const sl = (k) => {
    const i = pad[k];
    let left = i.max_slots - i.scores.length - i.sealed;
    if (RED_KEYS.has(k) && state.shared_red && state.shared_red[k] !== -1 && i.scores.length === 0) left = 0;
    return left;
  };
  if (n===5 && keys.length===1 && sl('dragon_breath')>0) return {key:'dragon_breath', cards};
  const s1 = new Set(keys);
  if (n===5 && s1.size===5 && ['A','B','C','D','E'].every(c=>s1.has(c)) && sl('arcane_sequence')>0) return {key:'arcane_sequence', cards};
  if (n===5 && s1.size===5 && ['B','C','D','E','F'].every(c=>s1.has(c)) && sl('elemental_surge')>0) return {key:'elemental_surge', cards};
  const vals = Object.values(ct).sort((a,b)=>b-a);
  if (n===5 && vals[0]===3 && vals[1]===2 && sl('chaos_alchemy')>0) return {key:'chaos_alchemy', cards};
  if (n===3 && keys.length===1 && sl('triple_resonance')>0) return {key:'triple_resonance', cards};
  if (keys.length===1 && keys[0]==='F' && n>=3 && sl('ant_colony')>0) return {key:'ant_colony', cards};
  return null;
}

function arraysMatchUnordered(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.every((v,i) => v === sb[i]);
}

/* ── Phase: End Discard ───────────────────────────── */
function renderEndDiscard() {
  if (!state.is_my_turn) return '<div class="text-center text-muted">对手正在弃牌...</div>';
  const overflow = state.overflow || 0;
  let h = `<div class="text-center"><p>手牌超限 — 弃掉 ${overflow} 张</p>`;
  h += '<div class="action-bar">';
  if (selectedCards.length === overflow)
    h += `<button class="btn btn-danger" onclick="doEndDiscard()">确认弃牌</button>`;
  return h + '</div></div>';
}
function doEndDiscard() {
  const cards = selectedCards.map(i => state.my_hand[i]);
  sendAction('END_DISCARD', {cards});
}

/* ── Collision ────────────────────────────────────── */
function renderColPreDiscard() {
  const s = state;
  if (s.col_pre_done) return '<div class="text-center text-muted">等待对手弃牌...</div>';
  const mustDiscard = s.col_must_discard || 0;
  let msg = mustDiscard > 0
    ? `对撞前 — 你需要弃掉 ${mustDiscard} 张牌以与对手手牌数一致`
    : '对撞前 — 可弃 0~2 张 (不参与对撞)';
  let h = `<div class="text-center"><p>${msg}</p>`;
  h += '<div class="action-bar">';
  const canConfirm = mustDiscard > 0 ? selectedCards.length === mustDiscard : selectedCards.length <= 2;
  if (canConfirm)
    h += `<button class="btn btn-success" onclick="doColPreDiscard()">确认 (弃${selectedCards.length}张)</button>`;
  return h + '</div></div>';
}
function doColPreDiscard() {
  const cards = selectedCards.map(i => state.my_hand[i]);
  sendAction('COLLISION_PRE_DISCARD', {cards});
}

function renderColBet() {
  const s = state;
  const isCaller = (s.my_idx === s.col_bet_caller);
  const phase = s.col_bet_phase;
  if (phase === 'CALLER') {
    if (!isCaller) return '<div class="text-center text-muted">对手正在决定赌注...</div>';
    let h = '<div class="text-center">';
    h += '<p style="color:#D4AF37;font-size:1.1rem">对撞赌注</p>';
    h += '<p class="text-muted">跟注：双方各扣押注加入底池 · 退缩：你白得 5 分</p>';
    h += '<div class="action-bar">';
    h += '<button class="btn" onclick="sendAction(\'COLLISION_BET\',{amount:0})">不押注</button>';
    h += '<button class="btn btn-success" onclick="sendAction(\'COLLISION_BET\',{amount:10})">押 10 分</button>';
    h += '<button class="btn btn-danger" onclick="sendAction(\'COLLISION_BET\',{amount:20})">押 20 分</button>';
    h += '</div></div>';
    return h;
  }
  if (phase === 'RESPONDER') {
    if (isCaller) return `<div class="text-center text-muted">你押了 ${s.col_bet_amount} 分，等待对手回应...</div>`;
    let h = '<div class="text-center">';
    h += `<p style="color:#FF6B6B;font-size:1.1rem">对手押注 ${s.col_bet_amount} 分！</p>`;
    h += '<div class="action-bar">';
    h += `<button class="btn btn-success" onclick="sendAction('COLLISION_BET',{choice:'follow'})">跟注 (−${s.col_bet_amount} 分)</button>`;
    h += `<button class="btn" onclick="sendAction('COLLISION_BET',{choice:'fold'})">退缩 (对手 +5 分)</button>`;
    h += '</div></div>';
    return h;
  }
  return '<div class="text-center text-muted">处理中...</div>';
}

function renderColFlip() {
  const s = state;
  let h = '';
  h += `<div class="col-scores">底池 ${s.col_pot} · 我方 ${s.col_scores[s.my_idx]} · 对手 ${s.col_scores[1-s.my_idx]}</div>`;

  const oppCount = s.col_opp_card_count;
  const oppRevealed = s.col_opp_revealed || {};
  const oppFlipped = new Set(s.col_opp_flipped || []);
  h += '<div class="text-center text-muted mb-2">对手暗阵</div><div class="col-row">';
  for (let i = 0; i < oppCount; i++) {
    if (oppFlipped.has(i)) h += cardHTML(oppRevealed[i] || '?', {small:true});
    else h += cardHTML('?', {faceDown:true, small:true});
  }
  h += '</div>';

  const myCount = s.col_my_card_count || (s.col_my_cards || []).length;
  const myRevealed = s.col_my_revealed || {};
  const myFlipped = new Set(s.col_my_flipped || []);
  const waitFor = s.col_waiting_for;
  const isMyFlip = (waitFor === s.my_idx);
  h += '<div class="text-center text-muted mb-2 mt-2">我方暗阵</div><div class="col-row">';
  for (let i = 0; i < myCount; i++) {
    if (myFlipped.has(i)) h += cardHTML(myRevealed[i] || '?', {small:true});
    else if (isMyFlip) h += `<div onclick="sendAction('COLLISION_FLIP',{})" class="col-card">` + cardHTML('?', {faceDown:true, small:true}) + '</div>';
    else h += cardHTML('?', {faceDown:true, small:true});
  }
  h += '</div>';
  h += isMyFlip
    ? '<div class="text-center mt-2" style="color:#D4AF37">轮到你翻牌</div>'
    : '<div class="text-center mt-2 text-muted">等待对手翻牌...</div>';
  return h;
}

/* ── Game Over ─────────────────────────────────────── */
function renderGameOver() {
  clearSession();
  showScreen('gameOver');
  const s = state;
  const el = document.getElementById('gameOver');
  const isWinner = s.winner === s.my_idx;
  let h = `<h1>${isWinner ? '胜利' : (s.winner < 0 ? '平局' : '败北')}</h1>`;
  h += `<div class="final-scores">${s.my_name} ${s.final_scores[s.my_idx]} — ${s.opp_name} ${s.final_scores[1-s.my_idx]}</div>`;
  if (s.col_scores && (s.col_scores[0] || s.col_scores[1])) {
    h += `<div class="text-muted mt-2">对撞 ${s.col_scores[0]} vs ${s.col_scores[1]}</div>`;
  }
  h += `<div class="mt-4"><button class="btn" onclick="location.reload()">返回大厅</button></div>`;

/* ── Toast ─────────────────────────────────────────── */
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 3000);
}

/* Ping */
setInterval(() => { fetch('/ping').catch(() => {}); }, 4 * 60 * 1000);

/* BGM */
let bgmPlaying = false;
function tryAutoPlayBGM() {
  if (bgmPlaying) return;
  const audio = document.getElementById('bgm');
  if (!audio) return;
  audio.volume = 0.3;
  audio.play().then(() => {
    bgmPlaying = true;
    const btn = document.getElementById('bgmControl');
    if (btn) btn.textContent = '🔊';
  }).catch(() => {});
}
function toggleBGM() {
  const audio = document.getElementById('bgm');
  const btn = document.getElementById('bgmControl');
  if (!audio) return;
  if (bgmPlaying) { audio.pause(); btn.textContent = '🔇'; }
  else { audio.volume = 0.3; audio.play().catch(() => {}); btn.textContent = '🔊'; }
  bgmPlaying = !bgmPlaying;
}

/* Init */
document.addEventListener('DOMContentLoaded', () => {
  initSocket();
  document.addEventListener('click', tryAutoPlayBGM, {once: true});
});

<script>
/* Offline Shim — adapts existing game.js (which uses Socket.IO) to call the
 * local OfflineEngine. Provides the same socket interface so game.js works unmodified.
 */
(function(){
'use strict';

const E = window.OfflineEngine;
let engine = null;       // GameRoom instance
let humanIdx = 0;        // human player index
let aiIdx = 1;           // 零's index
let aiPending = null;    // setTimeout id for next AI step

// ── Fake socket ─────────────────────────────────────────
const fakeSocket = {
  _handlers: {},
  on(event, handler){ this._handlers[event] = handler; },
  emit(event, data){
    // Outbound from client. We handle each by translating to engine action.
    if (event === 'create_room' || event === 'create_ai_room' ||
        event === 'join_room' || event === 'reconnect_room') {
      // Ignored; offline.html starts game directly via startOfflineGame()
      return;
    }
    if (event === 'leave_room') { stopGame(); return; }
    if (event === 'action') {
      handleClientAction(data.action, data.data || {});
      return;
    }
  },
};

function fireEvent(event, data){
  const h = fakeSocket._handlers[event];
  if (h) h(data);
}

// Override io() before game.js runs
window.io = function(){ return fakeSocket; };

// ── Lobby controls (replace network creation with local engine init) ──
function startOfflineGame(){
  const name = document.getElementById('playerName').value.trim() || '炼金术士';
  engine = new E.GameRoom('OFFLINE', name, '零', true);
  engine.startGame();
  humanIdx = 0;
  aiIdx = 1;
  E.setAIIdx(aiIdx);

  // Inform game.js as if a "room created" event happened
  fireEvent('connected', {});
  fireEvent('room_created', {room_id: 'OFFLINE', player_idx: humanIdx});
  pushState();
  scheduleAI();
}
window.startOfflineGame = startOfflineGame;

// Override game.js's lobby helpers because there's no server
window.createRoom = startOfflineGame;
window.createAIRoom = startOfflineGame;
window.joinRoom = startOfflineGame;
window.tryAutoReconnect = function(){};  // no reconnect offline

function stopGame(){
  if (aiPending){ clearTimeout(aiPending); aiPending = null; }
  engine = null;
  fireEvent('left_room', {});
}

function pushState(){
  if (!engine) return;
  const view = engine.getView(humanIdx);
  fireEvent('state', view);
}

// ── Handle outbound action from game.js ──────────────────
function handleClientAction(action, data){
  if (!engine) return;
  // Determine which player this action belongs to.
  const phase = engine.phase;
  let actor = humanIdx;
  // Defender phase: actor is the defender (which is human if AI is current_player)
  if (phase === 'AMBUSH_DEF_CHOICE') actor = 1 - engine.current_player;
  // Collision phases: actor depends on phase state
  if (phase === 'COLLISION_PRE_DISCARD'){
    // Whichever side hasn't submitted yet & matches human
    if (!engine.col_pre_discard_done[humanIdx]) actor = humanIdx;
    else actor = 1 - humanIdx;
  } else if (phase === 'COLLISION_BET'){
    if (engine.col_bet_phase === 'CALLER') actor = engine.col_bet_caller;
    else actor = 1 - engine.col_bet_caller;
  } else if (phase === 'COLLISION_FLIP'){
    actor = engine._colWaitingFor();
  }
  // Only allow human's actions; AI uses scheduleAI() directly
  // (this shim assumes the click came from the human)
  const [ok, err] = engine.handleAction(actor, action, data);
  if (!ok){
    fireEvent('action_error', {msg: err || 'invalid action'});
    pushState();
    return;
  }
  pushState();
  scheduleAI();
}

// ── Drive 零 (AI) automatically when it's their turn ─────
function scheduleAI(){
  if (aiPending){ clearTimeout(aiPending); aiPending = null; }
  if (!engine || engine.phase === 'GAME_OVER') return;

  // Determine if AI needs to act
  const phase = engine.phase;
  let actor = -1;
  if (phase === 'AMBUSH_DEF_CHOICE') actor = 1 - engine.current_player;
  else if (phase === 'COLLISION_PRE_DISCARD') {
    for (let i=0;i<2;i++) if (!engine.col_pre_discard_done[i]) { actor = i; break; }
  } else if (phase === 'COLLISION_BET'){
    if (engine.col_bet_phase === 'CALLER') actor = engine.col_bet_caller;
    else actor = 1 - engine.col_bet_caller;
  } else if (phase === 'COLLISION_FLIP') actor = engine._colWaitingFor();
  else actor = engine.current_player;

  if (actor !== aiIdx) return;
  if (actor < 0) return;

  // Get AI decision
  E.setAIIdx(aiIdx);
  const decision = E.decide(engine);
  if (!decision) return;
  const [action, data] = decision;
  const delay = E.getDelay(action);

  aiPending = setTimeout(() => {
    aiPending = null;
    if (!engine || engine.phase === 'GAME_OVER') return;
    // Re-validate that AI is still the actor (state could have changed)
    const newDecision = (function(){
      try { E.setAIIdx(aiIdx); return E.decide(engine); } catch(e){ console.error(e); return null; }
    })();
    if (!newDecision) return;
    const [a2, d2] = newDecision;
    const [ok, err] = engine.handleAction(aiIdx, a2, d2);
    if (!ok){
      console.warn('AI action failed:', a2, err);
      // Try fallback skip
      const fallbackMap = {
        DRAW: ['DRAW_ACK', {}],
        MARKET: ['MARKET_SKIP', {}],
        AMBUSH_DECIDE: ['AMBUSH_DECIDE', {choice:'skip'}],
        AMBUSH_PAY_COST: ['AMBUSH_CANCEL', {}],
        AMBUSH_ATK_SELECT: ['AMBUSH_CANCEL', {}],
        SPELL: ['SPELL_SKIP', {}],
        END_DISCARD: null,  // can't skip
        LOCKDOWN_PLACE: ['LOCKDOWN_SKIP', {}],
      };
      const fb = fallbackMap[engine.phase];
      if (fb) engine.handleAction(aiIdx, fb[0], fb[1]);
    }
    pushState();
    scheduleAI();
  }, delay);
}
